name: "SearXNG Search Engine"
version: "1.0.21"
slug: "searxng"
description: "Privacy-respecting metasearch engine for Home Assistant"
url: "https://github.com/searxng/searxng"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
host_network: true
ports:
  8787/tcp: 8787
ports_description:
  8080/tcp: SearXNG web interface and API
webui: "http://[HOST]:[PORT:8787]"
options:
  safe_search: 2
  enable_google: false
  enable_duckduckgo: true
  enable_brave: false
  enable_bing: false
  enable_wikipedia: true
  enable_reddit: false
  enable_github: false
  enable_stackoverflow: false
schema:
  safe_search: list(0|1|2)
  enable_google: bool
  enable_duckduckgo: bool
  enable_brave: bool
  enable_bing: bool
  enable_wikipedia: bool
  enable_reddit: bool
  enable_github: bool
  enable_stackoverflow: bool
environment:
  SEARXNG_BASE_URL: "http://fhassistant.local:8787/"
  SEARXNG_SETTINGS_PATH: "/etc/searxng/settings.yml"


